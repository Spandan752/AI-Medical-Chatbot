version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: ai-medical-chatbot
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-medical-chatbot}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - MODEL_TEMPERATURE=${MODEL_TEMPERATURE:-0.7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medical-chatbot-network
    # Uncomment for production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 1G

  # Optional: Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: medical-chatbot-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - medical-chatbot-network
  #   restart: unless-stopped

networks:
  medical-chatbot-network:
    driver: bridge
