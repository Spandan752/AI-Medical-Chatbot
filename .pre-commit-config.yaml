# Pre-commit configuration file

repos:
  - repo: https://github.com/pre-commit/mirrors-flake8
    rev: v5.0.4  # Replace with the latest version
    hooks:
      - id: flake8

  - repo: https://github.com/psf/black
    rev: 23.1.0  # Replace with the latest version
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1  # Replace with the latest version
    hooks:
      - id: isort

  - repo: https://github.com/python/mypy
    rev: v1.0.3  # Replace with the latest version
    hooks:
      - id: mypy

  - repo: https://github.com/PyCQA/bandit
    rev: v1.7.4  # Replace with the latest version
    hooks:
      - id: bandit

exclude: >
  (\.git)|(\.venv)|(__pycache__)|(build)|(dist)
